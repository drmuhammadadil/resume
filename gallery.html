<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Dr. Muhammad Adil</title>
  <meta name="description" content="Conferences, trainings, honors and academic activities — photo gallery of Dr. Muhammad Adil.">
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f7f5f2;color:#221b1b}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .card{max-width:620px;background:#fff;border:1px solid #e9e2dc;border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
    .spinner{width:34px;height:34px;margin:0 auto 16px;border:3px solid #eadfd8;border-top-color:#7a1620;border-radius:50%;animation:spin .8s linear infinite}
    a{color:#7a1620}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="card">
      <div class="spinner" aria-hidden="true"></div>
      <strong>Loading gallery…</strong>
      <p>This page restores the original gallery from the last working gallery revision.</p>
    </div>
  </div>
  <script>
  (function(){
    var source='https://raw.githubusercontent.com/drmuhammadadil/resume/0d57cd052802fff7d8ad10aeba964ebd54ec5b53/gallery.html';
    fetch(source,{cache:'force-cache'})
      .then(function(r){if(!r.ok) throw new Error('HTTP '+r.status); return r.text();})
      .then(function(html){
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(){
        document.getElementById('loading').innerHTML='<div class="card"><strong>Gallery could not load.</strong><p><a href="'+source+'">Open the original gallery</a> or return to <a href="/">the homepage</a>.</p></div>';
      });
  })();
  </script>
  <noscript><div class="loading"><div class="card"><p>JavaScript is required to load the gallery.</p><p><a href="https://raw.githubusercontent.com/drmuhammadadil/resume/0d57cd052802fff7d8ad10aeba964ebd54ec5b53/gallery.html">Open original gallery</a></p></div></div></noscript>
</body>
</html>
